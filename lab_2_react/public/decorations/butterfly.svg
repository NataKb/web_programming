<svg width="460" height="300" viewBox="0 0 460 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .left-wings {
      transform-box: view-box;
      transform-origin: 230px 145px;
      animation: flap-left 1.2s ease-in-out infinite alternate;
    }
    .right-wings {
      transform-box: view-box;
      transform-origin: 230px 145px;
      animation: flap-right 1.2s ease-in-out infinite alternate;
    }
    @keyframes flap-left {
      from { transform: rotate(0deg); }
      to { transform: rotate(-7deg); }
    }
    @keyframes flap-right {
      from { transform: rotate(0deg); }
      to { transform: rotate(7deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .left-wings, .right-wings { animation: none; }
    }
  </style>
